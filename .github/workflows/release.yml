name: Build and Publish Versioned Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic release version (without v prefix, e.g. 0.2.0)'
        required: true
        type: string
      registry:
        description: 'Optional container registry override (defaults to vars.CONTAINER_REGISTRY or ghcr.io)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
            echo "Invalid version '$VERSION'" >&2
            exit 1
          fi
          REGISTRY="${{ inputs.registry || vars.CONTAINER_REGISTRY || 'ghcr.io' }}"
          REPO_LOWER="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY%/}/${REPO_LOWER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch pinned Docker image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release bundle tarball, manifest & SHA256SUMS
        run: |
          mkdir -p dist-release
          TARBALL="supportdesk-v${{ steps.meta.outputs.version }}.tar.gz"
          tar -czf "dist-release/${TARBALL}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='.env.development' \
            --exclude='.env.test' \
            --exclude='data' \
            --exclude='backups' \
            --exclude='tests' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='firebase-applet-config.json' \
            --exclude='dist-release' \
            .
          cp install.sh dist-release/install.sh
          chmod +x dist-release/install.sh
          TARBALL_SHA="$(sha256sum "dist-release/${TARBALL}" | awk '{print $1}')"
          cat > dist-release/release-manifest.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "tag": "${{ steps.meta.outputs.tag }}",
            "image": "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}",
            "imageDigest": "${{ steps.docker.outputs.digest }}",
            "platforms": ["linux/amd64", "linux/arm64"],
            "tarball": "${TARBALL}",
            "tarballSha256": "${TARBALL_SHA}",
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          (
            cd dist-release
            sha256sum "install.sh" "${TARBALL}" "release-manifest.json" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish GitHub Release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "SupportDesk ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist-release/install.sh
            dist-release/supportdesk-v${{ steps.meta.outputs.version }}.tar.gz
            dist-release/release-manifest.json
            dist-release/SHA256SUMS
