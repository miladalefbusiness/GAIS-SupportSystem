services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportdesk}
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${SQL_USER:-supportdesk_app}
      APP_DB_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-supportdesk_admin} -d ${POSTGRES_DB:-supportdesk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION must be pinned to a release version}
    image: ${APP_IMAGE:-ghcr.io/your-org/supportdesk}:${APP_VERSION:?APP_VERSION must be pinned to a release version}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-Asia/Tehran}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      SQL_HOST: ${SQL_HOST:-postgres}
      SQL_PORT: ${SQL_PORT:-5432}
      SQL_DB_NAME: ${SQL_DB_NAME:-supportdesk}
      SQL_USER: ${SQL_USER:-supportdesk_app}
      SQL_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-supportdesk_admin}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:?SQL_ADMIN_PASSWORD is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      APP_HMAC_KEY: ${APP_HMAC_KEY:?APP_HMAC_KEY is required}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@support.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-مدیر ارشد سامانه}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ROOT: /var/lib/supportdesk/storage
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-10737418240}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-disabled}
      OTP_SMS_WEBHOOK_URL: ${OTP_SMS_WEBHOOK_URL:-}
      OTP_SMS_API_KEY: ${OTP_SMS_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AV_SCANNER_MODE: ${AV_SCANNER_MODE:-disabled}
      CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      VALIDATE_ENV_ON_START: "true"
      RUN_MIGRATIONS_ON_START: "true"
      RUN_BOOTSTRAP_ON_START: "true"
    volumes:
      - storage_data:/var/lib/supportdesk/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  worker:
    image: ${APP_IMAGE:-ghcr.io/your-org/supportdesk}:${APP_VERSION:?APP_VERSION must be pinned to a release version}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    command: ["node", "./node_modules/tsx/dist/cli.mjs", "./scripts/worker.ts"]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Tehran}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      SQL_HOST: ${SQL_HOST:-postgres}
      SQL_PORT: ${SQL_PORT:-5432}
      SQL_DB_NAME: ${SQL_DB_NAME:-supportdesk}
      SQL_USER: ${SQL_USER:-supportdesk_app}
      SQL_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-supportdesk_admin}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:?SQL_ADMIN_PASSWORD is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      APP_HMAC_KEY: ${APP_HMAC_KEY:?APP_HMAC_KEY is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ROOT: /var/lib/supportdesk/storage
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-10737418240}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-3000}
      WORKER_HEARTBEAT_FILE: /tmp/supportdesk-worker-heartbeat
      VALIDATE_ENV_ON_START: "true"
      RUN_MIGRATIONS_ON_START: "false"
      RUN_BOOTSTRAP_ON_START: "false"
    volumes:
      - storage_data:/var/lib/supportdesk/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const ts=Number(fs.readFileSync('/tmp/supportdesk-worker-heartbeat','utf8'));if(!ts||Date.now()-ts>45000)process.exit(1);\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      TZ: ${TZ:-Asia/Tehran}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    entrypoint: ["/bin/sh", "/etc/caddy/proxy-entrypoint.sh"]
    volumes:
      - ./docker/Caddyfile.template:/etc/caddy/Caddyfile.template:ro
      - ./docker/proxy-entrypoint.sh:/etc/caddy/proxy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || nc -z 127.0.0.1 80"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

volumes:
  pg_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
