services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportdesk}
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${SQL_USER:-supportdesk_app}
      APP_DB_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportdesk_admin} -d ${POSTGRES_DB:-supportdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-supportdesk}:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:-https://support.example.com}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_DB_NAME: ${POSTGRES_DB:-supportdesk}
      SQL_USER: ${SQL_USER:-supportdesk_app}
      SQL_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      SQL_ADMIN_USER: ${POSTGRES_USER:-supportdesk_admin}
      SQL_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      APP_HMAC_KEY: ${APP_HMAC_KEY:?APP_HMAC_KEY is required}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@support.example.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-مدیر ارشد سامانه}
      STORAGE_DRIVER: local
      STORAGE_ROOT: /var/lib/supportdesk/storage
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-10737418240}
      RUN_MIGRATIONS_ON_START: "true"
      RUN_BOOTSTRAP_ON_START: "true"
    volumes:
      - storage_data:/var/lib/supportdesk/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pg_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
